name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate pyproject
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
      - name: Compile Python
        run: python -m compileall -q guard scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline regression benchmark
        run: python scripts/benchmark.py
      - name: CLI smoke test
        run: |
          python scripts/guard_cli.py version
          python scripts/guard_cli.py plan --task "change the footer phone number" --repo .
          python scripts/guard_cli.py inspect --repo .
          python scripts/guard_cli.py usage --repo .
          python scripts/guard_cli.py ui-context --repo .
          python scripts/guard_cli.py ui-audit --repo . --json
          python scripts/guard_cli.py launch --dry-run --repo . "change the footer phone number"
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('install.ps1', 'uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }


  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test -p usage-guard-core

  visualizer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Tauri config JSON
        shell: pwsh
        run: |
          Get-Content apps/visualizer/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json | Out-Null
      - name: Build Tauri visual companion
        run: cargo build --release --manifest-path apps/visualizer/src-tauri/Cargo.toml
      - name: Upload Windows visualizer alpha
        uses: actions/upload-artifact@v4
        with:
          name: usage-guard-visualizer-windows-x64
          path: apps/visualizer/src-tauri/target/release/usage-guard-visualizer.exe
          if-no-files-found: error
