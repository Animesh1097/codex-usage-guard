name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q guard scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline regression benchmark
        run: python scripts/benchmark.py
      - name: CLI smoke test
        run: |
          python scripts/guard_cli.py version
          python scripts/guard_cli.py plan --task "change the footer phone number" --repo .
          python scripts/guard_cli.py inspect --repo .
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('install.ps1', 'uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
