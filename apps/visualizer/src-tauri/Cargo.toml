[package]
name = "usage-guard-visualizer"
version = "1.0.0-alpha.1"
description = "Non-critical visual companion for Codex Usage Guard"
edition = "2021"
license = "MIT"

[lib]
name = "usage_guard_visualizer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "usage-guard-visualizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
