[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-guard"
version = "0.2.1"
description = "A local usage-aware control plane and next-action controller for OpenAI Codex."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Animesh1097"}]
dependencies = []

[project.scripts]
codex-usage-guard = "guard.cli:main"

[tool.setuptools]
packages = ["guard"]
